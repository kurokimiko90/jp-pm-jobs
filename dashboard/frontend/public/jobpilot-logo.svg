<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <title>JobPilot career compass</title>
  <desc>A warm enamel compass badge with a cat guide at its centre.</desc>
  <defs>
    <linearGradient id="shell" x1="19" y1="13" x2="76" y2="87" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#FFF1DD"/>
    </linearGradient>
    <linearGradient id="gold" x1="31" y1="28" x2="65" y2="79" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9DB70"/>
      <stop offset="1" stop-color="#F2B84D"/>
    </linearGradient>
  </defs>

  <!-- The offset shadow and fine route line give the mark an enamel-badge finish. -->
  <circle cx="49.5" cy="50.5" r="39" fill="#5A5248" opacity=".12"/>
  <circle cx="48" cy="48" r="39" fill="url(#shell)" stroke="#5A5248" stroke-width="2.6"/>
  <path d="M12.5 54C8.8 35.5 22.8 16.9 42.4 11.1" stroke="#D6B987" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 6"/>
  <circle cx="12.8" cy="54.2" r="3.4" fill="#F2B5C0" stroke="#5A5248" stroke-width="1.8"/>

  <!-- Cat ears + rounded face: a friendly guide rather than a corporate arrow. -->
  <path d="M28.2 41.5 25.5 23.2l15.1 8.7A25 25 0 0 1 48 30.7a25 25 0 0 1 7.4 1.2l15.1-8.7-2.7 18.3a21.2 21.2 0 0 1 6.3 15.3C74.1 70.2 62.4 79 48 79s-26.1-8.8-26.1-22.2a21.2 21.2 0 0 1 6.3-15.3Z" fill="url(#gold)" stroke="#5A5248" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="m29.6 29 2 9.1 6.8-4.2-8.8-4.9ZM66.4 29l-2 9.1-6.8-4.2 8.8-4.9Z" fill="#F2B5C0" opacity=".9"/>

  <!-- A tiny four-point compass on the forehead carries the career-navigation idea. -->
  <path d="m48 35.5 1.7 4.1 4.1 1.7-4.1 1.7-1.7 4.1-1.7-4.1-4.1-1.7 4.1-1.7 1.7-4.1Z" fill="#FFF9ED" stroke="#5A5248" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="M34.1 53.6c1.8 2.1 4.7 2.1 6.5 0M55.4 53.6c1.8 2.1 4.7 2.1 6.5 0" stroke="#5A5248" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="31.3" cy="60.8" rx="4.4" ry="2.2" fill="#F2B5C0" opacity=".82"/>
  <ellipse cx="64.7" cy="60.8" rx="4.4" ry="2.2" fill="#F2B5C0" opacity=".82"/>
  <path d="m44.8 60.4 3.2-1.7 3.2 1.7-3.2 2.8-3.2-2.8Z" fill="#5A5248"/>
  <path d="M48 63.2v1.2m0 0c-1.4 1.8-3.1 2.5-5.1 1.8m5.1-1.8c1.4 1.8 3.1 2.5 5.1 1.8" stroke="#5A5248" stroke-width="1.7" stroke-linecap="round"/>

  <!-- North-star glint. -->
  <path d="m78.5 14.5 1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6 1.6-4.4Z" fill="#F5C842" stroke="#5A5248" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
