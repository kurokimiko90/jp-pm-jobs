# 報告目錄 — cadence stage 的骨架來源
#
# 對應使用者需求「各階段各事項產生什麼報告」。
# 每份報告必須有：頻度 / 讀者 / 決策用途 / 輸入 / 骨架 / 反面模式。
# Gate C 會檢查產出的報告清單是否帶齊「頻度・讀者・用途」三要素。

reports:
  # ============================================================
  #  入職初期（0-90 日）
  # ============================================================
  - id: landscape_memo
    name: 現況把握メモ（Landscape Memo）
    phase: [day0_30]
    cadence: 一次性（入職 2〜4 週）
    audience: [直屬主管, 產品團隊]
    decision: 對齊「我理解的現況」與「組織認知的現況」，暴露認知落差
    inputs: [既存資料分析, 關係人訪談 10〜15 人, 既存文件與過去實驗紀錄, 客訴/CS 紀錄]
    skeleton:
      - 事業モデルと収益構造の理解
      - 現在の指標水準（判明分）と欠測箇所
      - 既存プロダクトの強み・弱み（根拠つき）
      - 関係者が語る課題 vs データが語る課題の差分
      - 未確認事項リスト（{{要確認}} で明示）
    anti_pattern: 上任第一個月就提改革方案卻沒有資料基礎；把訪談意見當事實
    effort: 中

  - id: metric_baseline_report
    name: 指標ベースライン報告
    phase: [day0_30, day31_60]
    cadence: 一次性（之後每季重新校準）
    audience: [產品團隊, 資料團隊, 經營層]
    decision: 決定北極星與輸入指標，並確認資料是否可取得（不可取得的先立計測課題）
    inputs: [資料倉儲/分析工具, 既存 dashboard, 財務數字]
    skeleton:
      - 北極星指標の定義（計算式・対象期間・除外条件）
      - 入力指標 3〜5 個と現在値
      - ガードレール指標
      - 計測できていない項目と計測実装の必要工数
      - コホート別の現状（新規/既存/解約予備軍）
    anti_pattern: 定義了漂亮的指標但資料拿不到；定義中沒寫清楚除外條件導致各部門算出不同數字
    effort: 中

  - id: opportunity_backlog
    name: 機会バックログ（Opportunity Backlog）
    phase: [day31_60]
    cadence: 建立後每兩週更新
    audience: [產品團隊, 主管]
    decision: 決定接下來 1〜2 季要打哪些槓桿
    inputs: [現況把握メモ, 指標ベースライン, 顧客インタビュー, 競合分析]
    skeleton:
      - 機会カード（課題 / 影響を受ける指標 / 想定インパクト / 確信度 / 想定工数）
      - RICE スコアと順位
      - 今やらない理由（Not Now の明示）
    anti_pattern: 把解決方案當機會寫（機會欄應只寫問題與影響，方案是下一步）
    effort: 中

  - id: first_90_plan
    name: 90 日計画と成果コミット
    phase: [day0_30]
    cadence: 一次性（30 日目に主管と合意）
    audience: [直屬主管, 關係部門長]
    decision: 明確「何をもって成功とするか」，避免半年後才發現期待不一致
    inputs: [JD の期待値, 現況把握メモ, 主管との 1on1]
    skeleton:
      - 30/60/90 日の到達点（成果物ベース、活動ベースではなく）
      - 各到達点の判定基準
      - 必要な支援（データアクセス / 人員 / 予算 / 意思決定権限）
      - リスクと前提条件
    anti_pattern: 目標を活動量（面談 20 件）で書く；権限とアクセス権の要求を書き忘れる
    effort: 小

  # ============================================================
  #  例行（週次 / 月次 / 四半期）
  # ============================================================
  - id: growth_weekly
    name: グロース週次レビュー
    phase: [routine]
    cadence: 週次（曜日固定・30〜45 分）
    audience: [產品團隊, 相關職能, 主管]
    decision: 本週要開始/中止/加速哪個施策
    inputs: [指標 dashboard, 実験ステータス, 前週アクションの結果]
    skeleton:
      - 北極星と入力指標の推移（前週比・4 週移動平均）
      - 異常値とその原因（判明分/調査中を区別）
      - 進行中の実験一覧とステータス
      - 今週の意思決定事項（決めたこと・決めなかったこと）
      - ネクストアクション（担当・期限つき）
    anti_pattern: 數字報告會化（唸數字不做決策）；異常値を「様子見」で毎週先送り
    effort: 小（自動化前提）

  - id: experiment_design_doc
    name: 実験計画書
    phase: [routine]
    cadence: 各実験の開始前（必須・事前登録）
    audience: [產品團隊, 資料團隊, 相關職能]
    decision: 這個實驗值不值得跑、跑多久、什麼結果算贏
    inputs: [機会バックログ, 過去の類似実験, 指標ベースライン]
    skeleton:
      - 仮説（「Xすれば Y が Z% 改善する、なぜなら…」）
      - 対象・分流単位・分流比率
      - 主要指標 / ガードレール指標
      - 必要サンプル数と最短実施期間（検定力計算の根拠）
      - 判定基準と、採用/中止/再実験の事前合意
    anti_pattern: 事後に指標を選ぶ；サンプル数を計算せず開始；有利な数字が出た時点で早期終了
    effort: 小

  - id: experiment_result_report
    name: 実験結果報告
    phase: [routine]
    cadence: 各実験終了時（勝敗問わず必ず書く）
    audience: [產品團隊, 主管, 他チーム（学習の横展開）]
    decision: 採用・中止・条件付き再実験
    inputs: [実験計画書, 実測データ, 定性フィードバック]
    skeleton:
      - 結果サマリ（主要指標の変化・信頼区間・ガードレール）
      - 仮説は支持されたか（部分的支持も明記）
      - 想定外の観測
      - 学習点（次に活かせる一般化された知見）
      - 意思決定と根拠
    anti_pattern: 負けた実験を記録しない（同じ失敗を組織が繰り返す）；統計的有意性のない差を「改善傾向」と書く
    effort: 小

  - id: cohort_retention_report
    name: コホート継続率レポート
    phase: [routine]
    cadence: 月次
    audience: [產品團隊, 經營層]
    decision: 產品改善が実際に定着に効いているかの判定、解約対策の要否
    inputs: [利用ログ, 契約データ]
    skeleton:
      - 登録月別の継続率カーブ
      - 直近コホートと過去コホートの比較（改善しているか）
      - セグメント別の差分（プラン / 業種 / 規模 / 流入経路）
      - 解約理由の定性分類
    anti_pattern: 全体平均だけ見てセグメント差を見逃す；曲線が寝る前の若いコホートで判断する
    effort: 中

  - id: funnel_health_report
    name: ファネル健全性レポート
    phase: [routine]
    cadence: 月次
    audience: [產品團隊, 行銷/銷售]
    decision: どの段階に投資するか（獲客を増やすか、転換を上げるか）
    inputs: [流入データ, プロダクト利用ログ, CRM]
    skeleton:
      - 各段階の通過率と前月比
      - 最大のボトルネック段階と、その根拠
      - 流入経路別の質の差（登録後の定着率まで追う）
    anti_pattern: 流入数だけ増やして下流が詰まる；経路別の質を見ずに CPA だけで判断
    effort: 中

  - id: voice_of_customer_digest
    name: 顧客の声ダイジェスト
    phase: [routine]
    cadence: 月次
    audience: [產品團隊, CS, 經營層]
    decision: 定性課題の優先順位づけ、ロードマップへの反映
    inputs: [CS 問合せ, ユーザーインタビュー, NPS 自由記述, 営業からの要望]
    skeleton:
      - 件数の多い課題トップ N（件数と影響顧客数を区別）
      - 金額インパクトの大きい課題（解約リスク・失注理由）
      - 新規に出現した課題
      - すでに対応済みで再発しているもの
    anti_pattern: 声の大きい 1 社の要望が優先される；件数だけで判断し金額影響を見ない
    effort: 中

  - id: quarterly_business_review
    name: 四半期レビュー（QBR）
    phase: [routine]
    cadence: 四半期
    audience: [經營層, 全關係部門]
    decision: 次四半期のリソース配分とロードマップ確定
    inputs: [全指標, 実験結果の総括, 競合動向, 財務]
    skeleton:
      - 目標に対する達成度（未達は理由と学習）
      - 何を学んだか（仮説の更新）
      - 次四半期の重点と、やらないことの明示
      - 必要リソースとリスク
    anti_pattern: 達成した項目だけ並べる；未達の原因を外部要因に帰する
    effort: 大

  - id: competitive_landscape_update
    name: 競合・市場アップデート
    phase: [routine]
    cadence: 四半期（重大な動きがあれば随時）
    audience: [產品團隊, 銷售, 經營層]
    decision: ポジショニングの調整要否、対抗施策の要否
    inputs: [競合の公開情報, 失注理由, 顧客からの比較言及]
    skeleton:
      - 競合の直近の動き（出典つき）
      - 自社との機能・価格・体験の差分
      - 失注理由に占める競合起因の割合
      - 対応方針（追随 / 差別化 / 無視、それぞれの理由）
    anti_pattern: 機能比較表だけ作って終わる（顧客が実際に何で選んでいるかを問わない）
    effort: 中

  # ============================================================
  #  AI 產品專用
  # ============================================================
  - id: model_quality_report
    name: モデル品質レポート
    phase: [routine]
    cadence: リリース毎 + 週次モニタリング
    audience: [產品團隊, ML/工程團隊]
    decision: リリース可否、ロールバック要否、プロンプト/モデル変更の採用可否
    inputs: [ゴールデンテストセット, オフライン評価結果, オンラインの人手介入率・再生成率]
    skeleton:
      - オフライン評価（テストセット別の通過率・前回比）
      - オンライン品質指標（採用率 / 再生成率 / 否定的フィードバック率）
      - 退行したケースの具体例
      - リリース判定と根拠
    anti_pattern: オフライン評価だけで判断する；ゴールデンセットを更新せず過学習させる
    effort: 中

  - id: ai_cost_report
    name: AI 推論コストレポート
    phase: [routine]
    cadence: 月次（急増時は週次）
    audience: [產品團隊, 財務, 工程團隊]
    decision: モデル配分の見直し、上限設定、価格改定の要否
    inputs: [推論ログ, 課金データ]
    skeleton:
      - 成功タスクあたりコストの推移
      - コスト上位のユースケース・顧客
      - 再試行に消えているコストの割合
      - 粗利率への影響と、価格モデルとの整合
    anti_pattern: 呼び出し回数だけ見て再試行コストを見落とす；コスト削減で品質を落とし解約を招く
    effort: 小

  - id: ai_governance_pack
    name: AI ガバナンス資料一式
    phase: [day31_60, routine]
    cadence: 初回整備後、規制/モデル変更時に更新
    audience: [顧客の情シス・法務, 社內法務, 銷售]
    decision: 企業顧客の稟議通過（導入判断の実質的な関門）
    inputs: [データ処理フロー, 監査ログ設計, モデル提供者の規約, 適用法規]
    skeleton:
      - データの取扱い（学習利用の有無・保存期間・保存地域）
      - 権限設計とマスキング
      - 監査ログの取得範囲
      - 誤出力時の責任分界と対応フロー
      - 適用法規と対応状況（{{要確認}} を明示）
    anti_pattern: 営業が個別に口頭回答して整合が取れなくなる；法規の適用可否を確認せず断定する
    effort: 大
