  - id: jp_enterprise_saas_sales_led_reality
    name: 日本企業 SaaS 的銷售主導現實
    company: 日本 SaaS 業界通則（SmartHR / freee / Sansan 等公開 IR 與登壇資料彙整）
    era: 2018-
    business_model: [b2b_saas, enterprise]
    growth_stage: [pmf_to_scale, scale]
    lever: [acquisition, expansion]
    situation: >-
      日本企業採購決策多為稟議（ringi）制的集體決議，導入前要求詳細評估、
      現場說明與客製對應，純 PLG 自助導入的滲透速度低於歐美。
    action: >-
      多數日本 SaaS 採「行銷產生線索 → 內勤銷售（インサイドセールス）→ 外勤銷售
      → 客戶成功」的分工（The Model 型組織），PLG 元素多用於漏斗上緣的試用與擴散，
      而非取代銷售。
    result: 成為日本 B2B SaaS 的主流組織與獲客結構。
    why_it_works: >-
      配合稟議制的多方關係人決策，銷售負責在組織內部搬運共識，
      這是產品自助流程難以替代的功能。
    transferable_when: [目標客戶為日本企業, 客單價足以支撐銷售成本]
    caveats: >-
      這是結構性描述而非鐵律，SMB 與開發者工具領域仍有 PLG 空間；
      套用時務必以該公司實際的商業模式與客層驗證，不要直接假設。
    source: 日本 SaaS 上市公司 IR 說明資料與業界登壇內容之共通結構彙整
    confidence: medium

  - id: jp_ai_governance_expectation
    name: 日本企業導入 AI 時的治理期待
    company: 日本市場通則
    era: 2023-
    business_model: [ai_product, enterprise]
    growth_stage: [pmf_to_scale]
    lever: [acquisition, retention]
    situation: >-
      日本企業導入生成式 AI 時，資安・個資・出力責任的稟議關卡往往比功能評估更關鍵，
      採購方會要求說明資料是否用於再學習、記錄保存、以及誤出力時的責任歸屬。
    action: >-
      產品端把「治理素材」當作產品的一部分：資料處理說明書、稽核日誌、
      權限與遮罩設定、模型變更通知，並在銷售流程早期就交付。
    result: 治理素材完備度直接影響導入週期長度，是日本 AI SaaS 的實質競爭要素。
    why_it_works: 稟議制下阻力來自風險擔當者，先解除風險疑慮才輪到功能比較。
    transferable_when: [銷售對象為日本企業, 產品處理客戶資料或生成對外內容]
    caveats: >-
      具體法規要求依業種（金融/醫療/公部門）差異極大，
      務必以該公司實際適用的法規確認，不可一概而論。
    source: 日本企業 AI 導入相關公開指引與業界實務之共通觀察
    confidence: medium
