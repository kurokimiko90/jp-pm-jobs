  - id: github_copilot_acceptance_rate
    name: GitHub Copilot 以採納率作為核心產品指標
    company: GitHub
    era: 2021-2023
    business_model: [ai_product, b2b_saas]
    growth_stage: [pmf_to_scale]
    lever: [activation, retention]
    situation: >-
      生成式產品的品質無法用傳統準確率衡量，且離線評測與真實使用體感落差大。
    action: >-
      以「建議採納率（acceptance rate）」與「採納後留存於程式碼中的比例」
      作為線上核心指標，並公開研究開發者完成任務的速度差異。
    result: >-
      GitHub 公開的對照實驗顯示，使用 Copilot 的組完成指定任務的速度顯著快於對照組
      （官方部落格報告約 55% 更快，任務為撰寫 HTTP server）。
    why_it_works: >-
      採納率是「使用者用行為投票」的線上指標，比離線 benchmark 更貼近價值；
      採納後留存率進一步過濾掉「先接受再刪掉」的假陽性。
    transferable_when: [生成式 / 建議式 AI 產品, 使用者會在流程中即時取捨模型輸出]
    caveats: >-
      55% 這個數字來自特定任務的受控實驗，不可外推到所有開發情境；
      採納率可被「降低建議門檻」灌水，需搭配留存率與品質護欄。
    source: GitHub 官方部落格研究報告（2022-2023）
    confidence: medium

  - id: llm_product_eval_harness_pattern
    name: LLM 產品的離線評測 + 線上護欄雙軌制
    company: 業界通用實踐（Anthropic / OpenAI / Scale AI 等公開文件彙整）
    era: 2023-
    business_model: [ai_product]
    growth_stage: [pre_pmf, pmf_to_scale]
    lever: [retention, efficiency]
    situation: >-
      模型或 prompt 一改，品質可能整體位移，且退化往往在使用者投訴時才被發現。
    action: >-
      建立黃金測試集（golden set）＋自動評測（LLM-as-judge + 規則閘門）作為
      發版前的離線關卡；線上同步監控人工介入率、重試率、負面回饋率作為護欄指標；
      任何模型/prompt 變更走灰度發布。
    result: >-
      成為生成式產品發版流程的通用做法（各家官方工程部落格與評測工具文件均採此結構）。
    why_it_works: 生成式輸出無單一正解，只能用「分布是否退化」而非「單筆是否正確」來管理品質。
    transferable_when: [產品輸出由 LLM 生成, 有模型/prompt 迭代需求]
    caveats: >-
      LLM-as-judge 本身會漂移，需定期用人工標註校準；
      黃金測試集會過擬合，需持續從線上失敗案例補充。
    source: 各家 LLM 供應商官方評測文件與工程部落格之共通模式（非單一來源）
    confidence: medium

  - id: ai_cost_per_task_unit_economics
    name: AI 產品的單任務成本治理
    company: 業界通用實踐
    era: 2023-
    business_model: [ai_product, b2b_saas]
    growth_stage: [pmf_to_scale, scale]
    lever: [efficiency, revenue]
    situation: >-
      推論成本隨使用量線性成長，若定價為固定訂閱制，重度使用者會侵蝕毛利。
    action: >-
      以「單任務成本（cost per successful task）」為營運指標，
      拆解為 token 用量 × 單價 × 重試次數；用模型分級路由（小模型先行、
      失敗才升級）、快取、以及對高成本行為設用量上限來控管。
    result: 成為 AI SaaS 毛利管理的標準做法。
    why_it_works: >-
      把成本綁在「成功完成的任務」而非「呼叫次數」，
      讓失敗重試的成本浮上檯面，避免用便宜模型省錢卻因重試而更貴的假象。
    transferable_when: [推論成本佔營收比例顯著, 使用量分布長尾]
    caveats: 過度降級模型會傷害品質並提高流失，成本指標必須與品質護欄同時看。
    source: 業界通用實踐彙整（各 AI SaaS 公司工程/財務部落格共通模式）
    confidence: medium

  # ============================================================
  #  實驗文化 / 組織
  # ============================================================
  - id: booking_experimentation_culture
    name: Booking.com 的全員實驗制度
    company: Booking.com
    era: 2010-2019
    business_model: [marketplace, b2c]
    growth_stage: [scale, mature]
    lever: [acquisition, activation, revenue]
    situation: 主觀意見驅動的改版難以判斷成效，且高層意見容易壓過資料。
    action: >-
      建立任何員工都能在無需審批下啟動 A/B 測試的平台，
      同時強制所有實驗預先登記假設與成功指標；實驗結果公開透明。
    result: >-
      公開報導其同時運行的實驗規模達上千個；成為大規模實驗文化的代表案例
      （Harvard Business Review 2020 專文報導）。
    why_it_works: >-
      降低實驗的啟動成本 → 提高假設吞吐量；預先登記防止事後挑選有利指標（p-hacking）。
    transferable_when: [流量足以達成統計檢定力, 改動可被切分為可測單元]
    caveats: >-
      低流量產品跑不出顯著性，硬跑會被雜訊誤導；
      大量實驗會產生互相干擾與多重比較問題，需要平台層治理。
    source: Stefan Thomke "Building a Culture of Experimentation"（Harvard Business Review, 2020）
    confidence: high

  - id: amazon_working_backwards_prfaq
    name: Amazon Working Backwards（PR/FAQ）
    company: Amazon
    era: 2004-
    business_model: [b2c, enterprise]
    growth_stage: [pre_pmf, scale]
    lever: [activation, revenue]
    situation: 團隊容易從「我們能做什麼」出發，做出技術上可行但客戶不需要的東西。
    action: >-
      任何新產品在動工前先寫一份「上線新聞稿 + 常見問答」，
      用客戶語言描述價值；寫不清楚就不立項。六頁備忘錄取代簡報，會議開場先靜讀。
    result: 成為 Amazon 產品立項的標準流程，並被廣泛採用於其他公司。
    why_it_works: >-
      強迫在投入資源前先驗證「價值敘事是否成立」，
      文字比簡報更難掩蓋邏輯漏洞。
    transferable_when: [立項決策成本高, 需要跨部門對齊, 有寫作文化基礎]
    caveats: >-
      在需要快速試錯的早期階段可能過重；
      寫得好不等於做得成，仍需真實使用者驗證。
    source: Colin Bryar & Bill Carr《Working Backwards》（2021）; Amazon 股東信
    confidence: high

  # ============================================================
